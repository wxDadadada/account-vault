# 宝塔与 Docker 同机的 Linux 部署：保存本文件后执行 docker compose up -d。
# 宝塔 HTTPS 反向代理目标：http://127.0.0.1:8188。
# 所有部署配置直接修改本文件，无需 .env；更换域名时修改 APP_ORIGIN。
name: account-vault

services:
  app:
    image: wxdadadada/account-vault:latest
    pull_policy: always
    restart: unless-stopped
    # 共用宿主网络，让宝塔的直连来源固定为回环地址，无需查询 Docker 网关。
    network_mode: host
    environment:
      HOST: 127.0.0.1
      PORT: '8188'
      APP_ORIGIN: https://account.wxda.cc
      TRUSTED_PROXIES: 127.0.0.1,::1
      AI_ALLOWED_HOSTS: api.deepseek.com,api.openai.com,api.moonshot.cn,api.moonshot.ai,dashscope.aliyuncs.com,openrouter.ai
    volumes:
      - keyfolio_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'

volumes:
  keyfolio_data:
