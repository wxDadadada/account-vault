# 独立部署：保存本文件后执行 docker compose up -d。
# 远程访问：配置 APP_ORIGIN、TRUSTED_PROXIES，并用 HTTPS 反向代理连接本机 8188 端口。
name: account-vault

services:
  app:
    image: ${IMAGE:-wxdadadada/account-vault:0.1.0}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${PORT:-8188}:4318'
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8188}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      AI_ALLOWED_HOSTS: ${AI_ALLOWED_HOSTS:-api.deepseek.com,api.openai.com,api.moonshot.cn,api.moonshot.ai,dashscope.aliyuncs.com,openrouter.ai}
    volumes:
      - keyfolio_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'

volumes:
  keyfolio_data:
